[project]
name = "example"
version = "0.1.0"
description = "An example Python executable"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE.txt"]
dependencies = []

[project.scripts]
example = "example:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
